<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="JV Construction brand mark">
  <defs>
    <linearGradient id="jv-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#323D5F"/>
      <stop offset="1" stop-color="#151E35"/>
    </linearGradient>
    <linearGradient id="jv-salmon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD0B6"/>
      <stop offset="1" stop-color="#F1847C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="76" height="76" rx="20" fill="url(#jv-plate)"/>
  <rect x="3" y="3" width="74" height="74" rx="19" fill="none" stroke="#8890BA" stroke-opacity=".52" stroke-width="1"/>
  <!-- Roofline: this geometric peak identifies the construction sector. -->
  <path d="M13.5 25 40 11l26.5 14" fill="none" stroke="url(#jv-salmon)" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Structural J and V monogram with architectural stroke proportions. -->
  <path d="M19 32h15M31 32v15.4c0 7.5-4.5 12.3-11.6 12.3-3.4 0-6.1-1.2-8-3.1" fill="none" stroke="#F8F7FA" stroke-width="5.4" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="m41 33 10 25.4L61.5 33" fill="none" stroke="url(#jv-salmon)" stroke-width="5.6" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Foundation line and two tiny drafting ticks. -->
  <path d="M15 67.5h50" stroke="#B3BFDC" stroke-opacity=".68" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M20 65.3v4.3m40-4.3v4.3" stroke="#B3BFDC" stroke-opacity=".56" stroke-width="1.2" stroke-linecap="round"/>
</svg>
